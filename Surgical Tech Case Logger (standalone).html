document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sans-serif;\n\n  /* Brand */\n  --navy: #002855;\n  --navy-soft: #002855b2;\n  --blue: #0070f0;\n  --blue-dark: #004696;\n  --blue-light: #e8f2ff;\n  --lime: #97e152;\n  --sky: #46b1ef;\n\n  /* Surfaces */\n  --bg-canvas: #eef2f7;\n  --bg-card: #ffffff;\n  --bg-subtle: #f8fafc;\n  --bg-action-hover: #0028550a;\n  --border: #e2e8f0;\n  --border-strong: #0028556b;\n  --slate: #64748b;\n  --slate-700: #334155;\n\n  /* Status */\n  --success: #06764d;       --success-light: #e5fdcf;\n  --warning: #b54708;       --warning-light: #fef0c7;\n  --error: #b42318;         --error-light: #fee4e2;\n  --info: #016caa;          --info-light: #def3ff;\n  --pending: #6343bf;       --pending-light: #e6d8fb;\n\n  /* Accent — tweakable */\n  --accent: var(--blue);\n  --accent-dark: var(--blue-dark);\n  --accent-light: var(--blue-light);\n\n  --radius-sm: 4px;\n  --radius: 6px;\n  --radius-md: 8px;\n  --radius-xl: 12px;\n  --radius-full: 999px;\n\n  --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);\n  --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.10), 0 1px 2px -1px rgb(0 0 0 / 0.10);\n  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.10), 0 2px 4px -2px rgb(0 0 0 / 0.10);\n\n  --sidebar-w: 244px;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body {\n  font-family: var(--font-dm-sans);\n  color: var(--navy);\n  background: var(--bg-canvas);\n  font-size: 14px;\n  line-height: 20px;\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3 { font-family: var(--font-sora); color: var(--navy); letter-spacing: -0.02em; margin: 0; }\n\n.tabnum { font-variant-numeric: tabular-nums; }\n\n/* ---------- Shell ---------- */\n.shell { display: flex; min-height: 100vh; }\n\n.sidebar {\n  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);\n  background: var(--bg-card); border-right: 1px solid var(--border);\n  padding: 14px 12px; display: flex; flex-direction: column; gap: 2px;\n  position: sticky; top: 0; height: 100vh;\n}\n.sidebar .brand { display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 10px; }\n.sidebar .brand img { height: 26px; }\n.sidebar .group { font-size: 11px; color: var(--slate); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 14px 8px 5px; }\n.nav {\n  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius);\n  font-size: 14px; color: var(--slate-700); cursor: pointer; line-height: 20px;\n  background: transparent; border: 0; text-align: left; width: 100%; font-family: var(--font-dm-sans);\n  transition: background .12s, color .12s;\n}\n.nav:hover { background: var(--bg-action-hover); }\n.nav.active { background: var(--navy); color: #fff; font-weight: 500; }\n.nav.active svg { stroke: #fff; }\n.nav svg { width: 17px; height: 17px; flex: 0 0 17px; stroke: var(--slate); }\n.nav .nav-spacer { flex: 1; }\n.nav .count-pill {\n  font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-full);\n  background: var(--pending-light); color: var(--pending); display: inline-flex; align-items: center; justify-content: center;\n}\n.nav.active .count-pill { background: rgba(255,255,255,.2); color: #fff; }\n\n.sidebar .foot { margin-top: auto; padding: 10px 8px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); }\n.avatar { width: 30px; height: 30px; border-radius: 50%; background: #d4dbe2; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--navy); flex: 0 0 30px; }\n.foot-name { font-size: 13px; font-weight: 500; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.foot-role { font-size: 12px; color: var(--slate); }\n\n.canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; }\n\n.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--bg-canvas); flex-wrap: wrap; }\n.crumbs { font-size: 13px; color: var(--navy-soft); display: flex; gap: 6px; align-items: center; }\n.crumbs svg { width: 13px; height: 13px; stroke: var(--navy-soft); }\n.header h1 { font-size: 22px; font-weight: 600; margin-top: 3px; }\n\n.header-right { display: flex; align-items: center; gap: 12px; }\n.role-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--slate); }\n.role-toggle { display: inline-flex; background: var(--navy); border-radius: var(--radius-full); padding: 3px; gap: 2px; }\n.role-btn { padding: 6px 16px; font-size: 13px; font-family: var(--font-dm-sans); font-weight: 500; border: none; border-radius: var(--radius-full); background: transparent; color: rgba(255,255,255,.6); cursor: pointer; transition: all .15s; }\n.role-btn.active { background: #fff; color: var(--navy); font-weight: 600; }\n\n.page { padding: 24px 28px 40px; flex: 1; max-width: 1080px; width: 100%; }\n\n/* ---------- Views ---------- */\n.view { display: none; }\n.view.active { display: block; }\n\n/* ---------- Cards ---------- */\n.card-ui { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 22px 24px; }\n\n/* ---------- Tiles (KPI) ---------- */\n.tile-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px; }\n.tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-sm); }\n.tile .lbl { font-size: 12px; font-weight: 500; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; }\n.tile .val { font-family: var(--font-sora); font-size: 32px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }\n.tile .val.ok { color: var(--success); }\n.tile .val.warn { color: var(--warning); }\n.tile .val.danger { color: var(--error); }\n.tile .sub { font-size: 12px; color: var(--slate); margin-top: 8px; }\n.tile .delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; margin-top: 8px; color: var(--pending); }\n.tile .delta .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }\n\n/* ---------- Section labels ---------- */\n.sect-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--slate); margin: 0 0 12px; }\n.card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }\n.card-head h2 { font-size: 18px; font-weight: 600; }\n.hint { font-size: 12px; color: var(--slate); line-height: 1.55; margin-top: 12px; }\n\n/* ---------- Progress bars ---------- */\n.prog-block { margin-bottom: 18px; }\n.prog-block:last-child { margin-bottom: 0; }\n.prog-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }\n.prog-title { font-size: 13px; font-weight: 500; color: var(--navy); }\n.prog-count { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }\n.prog-count.danger { color: var(--error); font-weight: 500; }\n.track-wrap { position: relative; }\n.track-wrap.has-markers { padding-bottom: 20px; }\n.track { height: 8px; background: var(--border); border-radius: var(--radius-full); display: flex; overflow: visible; }\n.fill-approved { background: var(--success); height: 100%; border-radius: var(--radius-full) 0 0 var(--radius-full); transition: width .45s ease; }\n.fill-approved.solo { border-radius: var(--radius-full); }\n.fill-pending { height: 100%; border-radius: 0 var(--radius-full) var(--radius-full) 0; background: var(--pending); transition: width .45s ease; }\n.fill-over { background: var(--error); height: 100%; border-radius: var(--radius-full); }\n.marker { position: absolute; top: -2px; width: 2px; height: 12px; background: var(--navy-soft); opacity: .5; border-radius: 1px; }\n.marker-label { position: absolute; top: 13px; font-size: 11px; color: var(--slate); white-space: nowrap; transform: translateX(-50%); font-variant-numeric: tabular-nums; }\n.dash-legend { display: flex; gap: 18px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }\n.legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--slate); }\n.legend-swatch { width: 22px; height: 8px; border-radius: var(--radius-full); flex-shrink: 0; }\n.legend-tick { width: 2px; height: 12px; background: var(--navy-soft); opacity: .5; border-radius: 1px; margin: 0 10px; }\n\n/* ---------- Specialty grid ---------- */\n.spec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }\n.spec-card { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; transition: border-color .12s; }\n.spec-card.has-cases { border-color: var(--success); background: var(--success-light); }\n.spec-name { font-size: 13px; font-weight: 500; margin-bottom: 3px; color: var(--navy); }\n.spec-cnt { font-size: 12px; color: var(--slate); font-variant-numeric: tabular-nums; }\n.spec-card.has-cases .spec-name { color: var(--success); }\n.spec-card.has-cases .spec-cnt { color: var(--success); }\n\n/* ---------- Badges ---------- */\n.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500; line-height: 18px; border: 1px solid transparent; white-space: nowrap; }\n.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }\n.badge.success { background: var(--success-light); color: var(--success); }\n.badge.warning { background: var(--warning-light); color: var(--warning); }\n.badge.error   { background: var(--error-light); color: var(--error); }\n.badge.info    { background: var(--info-light); color: var(--info); }\n.badge.pending { background: var(--pending-light); color: var(--pending); }\n.badge.neutral { background: #d4dbe2; color: var(--navy); }\n.badge.outline { background: #fff; color: var(--navy); border-color: #0028551f; }\n\n/* ---------- Buttons ---------- */\n.btn { font-family: var(--font-dm-sans); font-weight: 500; font-size: 14px; padding: 9px 16px; border-radius: var(--radius); border: 1px solid transparent; line-height: 20px; transition: all .15s; display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; }\n.btn svg { width: 16px; height: 16px; }\n.btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-xs); }\n.btn-primary:hover { background: var(--accent-dark); }\n.btn-primary:disabled { opacity: .4; cursor: not-allowed; }\n.btn-secondary { background: var(--navy); color: #fff; }\n.btn-secondary:hover { background: #001a3a; }\n.btn-outline { background: #fff; border-color: var(--accent); color: var(--accent); }\n.btn-outline:hover { background: var(--accent-light); }\n.btn-ghost { background: transparent; color: var(--navy); }\n.btn-ghost:hover { background: var(--bg-action-hover); }\n.btn-success { background: var(--success); color: #fff; }\n.btn-success:hover { background: #055c3c; }\n.btn-danger-outline { background: #fff; border-color: var(--error); color: var(--error); }\n.btn-danger-outline:hover { background: var(--error-light); }\n.btn-block { width: 100%; }\n.btn-sm { padding: 6px 12px; font-size: 13px; line-height: 18px; }\n\n/* ---------- Forms ---------- */\n.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }\n.field label { font-size: 13px; font-weight: 500; color: var(--navy); }\n.field .req-star { color: var(--error); }\n.input, .field input[type=text], .field input[type=date], .field select, .field textarea {\n  font-family: var(--font-dm-sans); font-size: 14px; line-height: 20px; padding: 9px 12px;\n  border: 1px solid var(--border-strong); border-radius: var(--radius); background: #fff; color: var(--navy);\n  box-shadow: var(--shadow-xs); outline: none; transition: all .15s; width: 100%;\n}\n.field input::placeholder, .field textarea::placeholder { color: #00285566; }\n.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 50%, transparent); }\n.field textarea { resize: vertical; min-height: 80px; }\n.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n.field-row .field { margin-bottom: 0; }\n\n/* ---------- Scrub checklist ---------- */\n.scrub-check { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 16px; }\n.scrub-check-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin-bottom: 12px; }\n.check-item { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 11px; cursor: pointer; user-select: none; }\n.check-item:last-child { margin-bottom: 0; }\n.cb { width: 20px; height: 20px; border: 1.5px solid var(--border-strong); border-radius: var(--radius-sm); flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all .15s; background: #fff; }\n.cb.checked { background: var(--success); border-color: var(--success); }\n.cb.checked::after { content: ''; display: block; width: 5px; height: 10px; border: 2px solid #fff; border-top: none; border-left: none; transform: rotate(45deg) translate(-1px,-1px); }\n.check-label { font-size: 14px; line-height: 1.45; color: var(--navy); }\n\n/* ---------- Verdict ---------- */\n.scrub-verdict { padding: 10px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; background: var(--bg-subtle); color: var(--slate); border: 1px solid var(--border); }\n.scrub-verdict svg { width: 16px; height: 16px; flex-shrink: 0; }\n.verdict-1st { background: var(--success-light); color: var(--success); border-color: transparent; }\n.verdict-2nd { background: var(--warning-light); color: var(--warning); border-color: transparent; }\n\n/* ---------- Alerts ---------- */\n.alert { padding: 11px 14px; border-radius: var(--radius); font-size: 13px; line-height: 1.5; margin-bottom: 16px; display: flex; gap: 9px; align-items: flex-start; }\n.alert svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }\n.alert-warn { background: var(--warning-light); color: var(--warning); }\n.alert-cap { background: var(--success-light); color: var(--success); }\n.edit-banner { background: var(--info-light); color: var(--info); font-size: 13px; padding: 11px 14px; border-radius: var(--radius); margin-bottom: 18px; display: flex; gap: 9px; align-items: center; }\n.edit-banner svg { width: 16px; height: 16px; flex-shrink: 0; }\n\n/* ---------- History / case rows ---------- */\n.filter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 10px; flex-wrap: wrap; }\n.filter-row .count { font-size: 14px; color: var(--slate); }\n.filter-group { display: flex; gap: 8px; flex-wrap: wrap; }\n.filter-group select { font-size: 13px; font-family: var(--font-dm-sans); padding: 7px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: #fff; color: var(--navy); outline: none; box-shadow: var(--shadow-xs); cursor: pointer; }\n.case-list { display: flex; flex-direction: column; gap: 10px; }\n.case-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 14px 18px; display: flex; align-items: flex-start; gap: 14px; }\n.case-date { font-size: 12px; color: var(--slate); min-width: 84px; padding-top: 2px; flex-shrink: 0; font-variant-numeric: tabular-nums; }\n.case-info { flex: 1; min-width: 0; }\n.case-proc { font-size: 14px; font-weight: 500; color: var(--navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.case-meta { font-size: 12px; color: var(--slate); margin-top: 3px; }\n.case-comment { font-size: 12px; color: var(--error); margin-top: 8px; background: var(--error-light); padding: 7px 10px; border-radius: var(--radius); line-height: 1.45; display: flex; gap: 7px; align-items: flex-start; }\n.case-comment svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }\n.case-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }\n.case-actions { display: flex; gap: 4px; margin-top: 2px; }\n.icon-btn { border: none; background: none; cursor: pointer; color: var(--slate); padding: 4px; border-radius: var(--radius-sm); display: inline-flex; transition: all .12s; }\n.icon-btn svg { width: 15px; height: 15px; }\n.icon-btn:hover { background: var(--bg-action-hover); color: var(--navy); }\n.icon-btn.danger:hover { background: var(--error-light); color: var(--error); }\n.empty { text-align: center; padding: 48px 24px; color: var(--slate); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }\n.empty svg { width: 28px; height: 28px; stroke: var(--border-strong); }\n\n/* ---------- Requirements ---------- */\n.source-note { font-size: 12px; color: var(--slate); line-height: 1.6; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 20px; }\n.readiness-card { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }\n.readiness-score { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: 18px 20px; }\n.readiness-score-label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--navy); margin-bottom: 8px; }\n.readiness-pct { font-family: var(--font-sora); font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }\n.readiness-score-sub { font-size: 12px; color: var(--slate); margin-top: 8px; line-height: 1.4; }\n.req-section { margin-bottom: 24px; }\n.req-section:last-child { margin-bottom: 0; }\n.req-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }\n.req-row:last-child { border-bottom: none; }\n.req-icon { width: 20px; height: 20px; flex-shrink: 0; display: inline-flex; }\n.req-icon svg { width: 18px; height: 18px; }\n.req-text { flex: 1; font-size: 14px; color: var(--navy); }\n.req-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }\n.req-ok { color: var(--success); } .req-pend { color: var(--slate); } .req-danger { color: var(--error); }\n.req-pending-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: var(--radius-full); background: var(--pending-light); color: var(--pending); white-space: nowrap; }\n.req-pending-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }\n\n/* ---------- NCCT Section C table (Craft style) ---------- */\n.ncct-header { margin-bottom: 4px; }\n.ncct-org { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--slate); font-weight: 600; margin-bottom: 6px; }\n.ncct-title { font-family: var(--font-sora); font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }\n.ncct-subtitle { font-size: 13px; color: var(--slate); margin-top: 3px; }\n.ncct-note { font-size: 13px; color: var(--slate-700); line-height: 1.6; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; margin: 16px 0; }\n.ncct-table { width: 100%; border-collapse: collapse; font-size: 13px; }\n.ncct-table th { background: var(--bg-subtle); text-align: center; padding: 11px 12px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--slate); border-bottom: 1px solid var(--border); }\n.ncct-table th:first-child { text-align: left; width: 56%; }\n.ncct-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--navy); }\n.ncct-table td:not(:first-child) { text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }\n.ncct-table tr.section-head td { background: #fff; font-size: 11px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: .05em; padding: 9px 12px; }\n.ncct-table tr.totals-row td { background: var(--bg-subtle); font-weight: 600; border-top: 2px solid var(--border-strong); border-bottom: none; color: var(--navy); }\n.ncct-table tr.totals-row td:not(:first-child) { font-size: 15px; }\n.ncct-val-ok { color: var(--success); }\n.ncct-val-warn { color: var(--warning); }\n.ncct-val-zero { color: #cbd5e1; }\n.ncct-cap-note { font-size: 11px; color: var(--slate); display: block; font-weight: 400; margin-top: 2px; }\n.ncct-table tr.totals-row .ncct-cap-note { color: var(--navy-soft); }\n.ncct-status-bar { display: flex; gap: 14px; padding-top: 16px; margin-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }\n.ncct-stat { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--slate); }\n.ncct-stat strong { color: var(--navy); }\n.ncct-stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }\n.ncct-pending-note { font-size: 12px; padding: 11px 14px; border-radius: var(--radius); background: var(--pending-light); color: var(--pending); line-height: 1.5; margin-top: 16px; display: flex; gap: 9px; align-items: flex-start; }\n.ncct-pending-note svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }\n\n/* ---------- Preceptor queue cards ---------- */\n.queue-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: 18px 20px; margin-bottom: 14px; }\n.qc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 12px; }\n.qc-who { display: flex; align-items: center; gap: 11px; }\n.qc-name { font-size: 15px; font-weight: 600; color: var(--navy); }\n.qc-meta { font-size: 12px; color: var(--slate); margin-top: 2px; }\n.criteria-list { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 15px; margin-bottom: 14px; }\n.ci { display: flex; gap: 9px; font-size: 13px; margin-bottom: 8px; line-height: 1.4; align-items: flex-start; color: var(--navy); }\n.ci:last-child { margin-bottom: 0; }\n.ci svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; }\n.ci-ok svg { stroke: var(--success); }\n.ci-no svg { stroke: var(--error); }\n.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }\n\n@media (max-width: 720px) {\n  .sidebar { display: none; }\n  .page { padding: 20px 16px 40px; }\n  .header { padding: 14px 16px; }\n  .field-row { grid-template-columns: 1fr; }\n  .readiness-card { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<style>\n/* ---------- Tweak-driven overrides ---------- */\n:root { --accent: var(--blue); --accent-dark: var(--blue-dark); --accent-light: var(--blue-light); }\nbody[data-density=\"compact\"] .page { padding-top: 16px; }\nbody[data-density=\"compact\"] .tile { padding: 12px 14px; }\nbody[data-density=\"compact\"] .tile .val { font-size: 27px; }\nbody[data-density=\"compact\"] .card-ui { padding: 16px 18px; }\nbody[data-density=\"compact\"] .case-row { padding: 11px 14px; }\n\n/* ---------- Tweaks panel ---------- */\n#tweaks-panel {\n  position: fixed; top: 16px; right: 16px; width: 248px; z-index: 9999;\n  background: #fff; border: 1px solid var(--border); border-radius: var(--radius-xl);\n  box-shadow: 0 10px 30px -8px rgba(0,40,85,.25); padding: 14px 16px 16px;\n  font-family: var(--font-dm-sans); display: none;\n}\n#tweaks-panel.on { display: block; }\n#tweaks-panel .tp-title { font-family: var(--font-sora); font-size: 14px; font-weight: 600; color: var(--navy); margin-bottom: 12px; }\n#tweaks-panel .tp-group { margin-bottom: 14px; }\n#tweaks-panel .tp-group:last-child { margin-bottom: 0; }\n#tweaks-panel .tp-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin-bottom: 7px; }\n#tweaks-panel .tp-swatches { display: flex; gap: 8px; }\n#tweaks-panel .tp-sw { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .12s; }\n#tweaks-panel .tp-sw:hover { transform: scale(1.08); }\n#tweaks-panel .tp-sw.sel { border-color: var(--navy); }\n#tweaks-panel .tp-seg { display: inline-flex; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; gap: 3px; }\n#tweaks-panel .tp-seg button { flex: 1; border: none; background: transparent; font-family: var(--font-dm-sans); font-size: 12px; font-weight: 500; color: var(--slate); padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; }\n#tweaks-panel .tp-seg button.sel { background: #fff; color: var(--navy); box-shadow: var(--shadow-xs); }\n<\u002Fstyle>\n<\u002Fhead>\n<body data-density=\"comfortable\">\n\n<div class=\"shell\">\n\n  <!-- ===================== SIDEBAR ===================== -->\n  <aside class=\"sidebar\">\n    <div class=\"brand\"><img src=\"e33eda28-a645-43ac-a395-921ec2f42cf8\" alt=\"Craft\"><\u002Fdiv>\n\n    <nav id=\"learner-nav\">\n      <div class=\"group\">Learner<\u002Fdiv>\n      <button class=\"nav active\" data-view=\"dashboard\" onclick=\"showView('dashboard')\"><\u002Fbutton>\n      <button class=\"nav\" data-view=\"log\" onclick=\"showView('log')\"><\u002Fbutton>\n      <button class=\"nav\" data-view=\"history\" onclick=\"showView('history')\"><\u002Fbutton>\n      <button class=\"nav\" data-view=\"requirements\" onclick=\"showView('requirements')\"><\u002Fbutton>\n      <button class=\"nav\" data-view=\"sectionc\" onclick=\"showView('sectionc')\"><\u002Fbutton>\n    <\u002Fnav>\n\n    <nav id=\"preceptor-nav\" style=\"display:none\">\n      <div class=\"group\">Preceptor<\u002Fdiv>\n      <button class=\"nav active\" data-pview=\"queue\" onclick=\"showPreceptorView('queue')\"><\u002Fbutton>\n      <button class=\"nav\" data-pview=\"reviewed\" onclick=\"showPreceptorView('reviewed')\"><\u002Fbutton>\n    <\u002Fnav>\n\n    <div class=\"foot\">\n      <span class=\"avatar\" id=\"foot-avatar\">AL<\u002Fspan>\n      <div style=\"flex:1;min-width:0\">\n        <div class=\"foot-name\" id=\"foot-name\">Avery Lin<\u002Fdiv>\n        <div class=\"foot-role\" id=\"foot-role\">Surgical Tech Learner<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <!-- ===================== CANVAS ===================== -->\n  <div class=\"canvas\">\n    <div class=\"header\">\n      <div>\n        <div class=\"crumbs\"><span id=\"crumb-root\">Surgical Tech<\u002Fspan> <span id=\"crumb-sep\"><\u002Fspan> <span id=\"crumb-view\">Dashboard<\u002Fspan><\u002Fdiv>\n        <h1 id=\"page-title\">Dashboard<\u002Fh1>\n      <\u002Fdiv>\n      <div class=\"header-right\">\n        <span class=\"role-label\">Viewing as<\u002Fspan>\n        <div class=\"role-toggle\">\n          <button class=\"role-btn active\" id=\"role-learner\" onclick=\"setRole('learner')\">Learner<\u002Fbutton>\n          <button class=\"role-btn\" id=\"role-preceptor\" onclick=\"setRole('preceptor')\">Preceptor<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"page\">\n\n      <!-- ===== LEARNER VIEWS ===== -->\n      <div class=\"view active\" id=\"view-dashboard\" data-screen-label=\"Dashboard\">\n        <div class=\"tile-row\" id=\"metrics\"><\u002Fdiv>\n        <div class=\"card-ui\" style=\"margin-bottom:20px\">\n          <div class=\"sect-label\">Progress toward certification<\u002Fdiv>\n          <div id=\"prog-bars\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card-ui\">\n          <div class=\"sect-label\">Specialty breakdown — approved cases<\u002Fdiv>\n          <div class=\"spec-grid\" id=\"spec-grid\"><\u002Fdiv>\n          <p class=\"hint\">Progress counts approved cases only. Pending cases are shown separately. Specialties with at least one approved case are highlighted.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view\" id=\"view-log\" data-screen-label=\"Log a Case\">\n        <div class=\"card-ui\" style=\"max-width:640px\">\n          <div class=\"card-head\"><h2 id=\"form-title\">Log a New Case<\u002Fh2><\u002Fdiv>\n          <div class=\"edit-banner\" id=\"edit-banner\" style=\"display:none\"><\u002Fdiv>\n          <div class=\"field-row\" style=\"margin-bottom:16px\">\n            <div class=\"field\">\n              <label>Date <span class=\"req-star\">*<\u002Fspan><\u002Flabel>\n              <input type=\"date\" id=\"f-date\" required=\"\">\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Procedure Name<\u002Flabel>\n              <input type=\"text\" id=\"f-proc\" placeholder=\"e.g. laparoscopic cholecystectomy\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Category <span class=\"req-star\">*<\u002Fspan><\u002Flabel>\n            <select id=\"f-cat\" onchange=\"handleCatChange()\">\n              <option value=\"\">Select category<\u002Foption>\n              <option value=\"general\">General surgery<\u002Foption>\n              <option value=\"Gynecology\">Gynecology<\u002Foption>\n              <option value=\"Obstetrics\">Obstetrics<\u002Foption>\n              <option value=\"Genitourinary\">Genitourinary<\u002Foption>\n              <option value=\"Cardiovascular\">Cardiovascular<\u002Foption>\n              <option value=\"Neurosurgery\">Neurosurgery<\u002Foption>\n              <option value=\"Thoracic\">Thoracic<\u002Foption>\n              <option value=\"Peripheral Vascular\">Peripheral vascular<\u002Foption>\n              <option value=\"Ophthalmology\">Ophthalmology<\u002Foption>\n              <option value=\"Otorhinolaryngology\">Otorhinolaryngology (ENT)<\u002Foption>\n              <option value=\"Orthopedic\">Orthopedic<\u002Foption>\n              <option value=\"Plastic/Reconstructive\">Plastic / reconstructive<\u002Foption>\n              <option value=\"Diagnostic Scopes\">Diagnostic scopes<\u002Foption>\n              <option value=\"Other\">Other specialty<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <div id=\"cat-alert\" class=\"alert\" style=\"display:none\"><\u002Fdiv>\n          <div class=\"scrub-check\">\n            <div class=\"scrub-check-title\">1st Scrub Criteria — check all that apply<\u002Fdiv>\n            <div class=\"check-item\" onclick=\"toggleCheck('c1')\"><div class=\"cb\" id=\"c1\"><\u002Fdiv><div class=\"check-label\">Verified supplies and equipment needed for the procedure<\u002Fdiv><\u002Fdiv>\n            <div class=\"check-item\" onclick=\"toggleCheck('c2')\"><div class=\"cb\" id=\"c2\"><\u002Fdiv><div class=\"check-label\">Set up the sterile field with instruments, supplies, medications, and solutions<\u002Fdiv><\u002Fdiv>\n            <div class=\"check-item\" onclick=\"toggleCheck('c3')\"><div class=\"cb\" id=\"c3\"><\u002Fdiv><div class=\"check-label\">Performed counts with the circulator<\u002Fdiv><\u002Fdiv>\n            <div class=\"check-item\" onclick=\"toggleCheck('c4')\"><div class=\"cb\" id=\"c4\"><\u002Fdiv><div class=\"check-label\">Passed instruments and supplies to the surgical team during the procedure<\u002Fdiv><\u002Fdiv>\n            <div class=\"check-item\" onclick=\"toggleCheck('c5')\"><div class=\"cb\" id=\"c5\"><\u002Fdiv><div class=\"check-label\">Maintained sterile technique throughout (with knowledge to correct any breaks)<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"scrub-verdict\" id=\"verdict\"><span id=\"verdict-icon\"><\u002Fspan><span id=\"verdict-text\">Check criteria above to determine scrub type<\u002Fspan><\u002Fdiv>\n          <div class=\"field\">\n            <label>Assign to Preceptor <span class=\"req-star\">*<\u002Fspan><\u002Flabel>\n            <select id=\"f-preceptor\" onchange=\"updateVerdict()\">\n              <option value=\"\">Select preceptor<\u002Foption>\n              <option value=\"Dr. Sandra Okafor\">Dr. Sandra Okafor<\u002Foption>\n              <option value=\"RN Marcus Webb\">RN Marcus Webb<\u002Foption>\n              <option value=\"Dr. Priya Nambiar\">Dr. Priya Nambiar<\u002Foption>\n              <option value=\"RN Tomas Herrera\">RN Tomas Herrera<\u002Foption>\n              <option value=\"Dr. Lisa Fontaine\">Dr. Lisa Fontaine<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <button class=\"btn btn-primary btn-block\" id=\"submit-btn\" onclick=\"submitCase()\" disabled=\"\">Submit for Review<\u002Fbutton>\n          <button class=\"btn btn-ghost btn-block\" id=\"cancel-btn\" onclick=\"cancelEdit()\" style=\"display:none;margin-top:8px\">Cancel Edit<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view\" id=\"view-history\" data-screen-label=\"Case History\">\n        <div class=\"filter-row\">\n          <span class=\"count\" id=\"history-count\"><\u002Fspan>\n          <div class=\"filter-group\">\n            <select id=\"filter-status\" onchange=\"renderHistory()\">\n              <option value=\"\">All statuses<\u002Foption>\n              <option value=\"pending\">Pending<\u002Foption>\n              <option value=\"approved\">Approved<\u002Foption>\n              <option value=\"returned\">Returned<\u002Foption>\n            <\u002Fselect>\n            <select id=\"filter-cat\" onchange=\"renderHistory()\">\n              <option value=\"\">All categories<\u002Foption>\n              <option value=\"general\">General surgery<\u002Foption>\n              <option value=\"Gynecology\">Gynecology<\u002Foption>\n              <option value=\"Obstetrics\">Obstetrics<\u002Foption>\n              <option value=\"Genitourinary\">Genitourinary<\u002Foption>\n              <option value=\"Cardiovascular\">Cardiovascular<\u002Foption>\n              <option value=\"Neurosurgery\">Neurosurgery<\u002Foption>\n              <option value=\"Thoracic\">Thoracic<\u002Foption>\n              <option value=\"Peripheral Vascular\">Peripheral vascular<\u002Foption>\n              <option value=\"Ophthalmology\">Ophthalmology<\u002Foption>\n              <option value=\"Otorhinolaryngology\">Otorhinolaryngology (ENT)<\u002Foption>\n              <option value=\"Orthopedic\">Orthopedic<\u002Foption>\n              <option value=\"Plastic/Reconstructive\">Plastic / reconstructive<\u002Foption>\n              <option value=\"Diagnostic Scopes\">Diagnostic scopes<\u002Foption>\n              <option value=\"Other\">Other specialty<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"case-list\" id=\"case-list\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view\" id=\"view-requirements\" data-screen-label=\"Requirements\">\n        <div class=\"source-note\">Requirements sourced verbatim from the NCCT TS-C Critical Skills Competency / Qualification form (2025, form TE-0204CSQE). Progress counts approved cases only. No per-specialty case minimum is stated — only that the 75–95 specialty case total must span at least 3 different categories.<\u002Fdiv>\n        <div id=\"req-content\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view\" id=\"view-sectionc\" data-screen-label=\"NCCT Section C Form\">\n        <div id=\"sectionc-content\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===== PRECEPTOR VIEWS ===== -->\n      <div class=\"view\" id=\"view-queue\" data-scre
